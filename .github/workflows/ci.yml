name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # compile.sh is the SAME invocation the local builds use. CI previously kept its own
      # copy of the swiftc command, which went stale when NavigatorCore.swift was split out
      # of main.swift — every push failed for months while local builds were green.
      - name: Build
        run: ./compile.sh /tmp/Navigator.bin

      # The suite is the actual safety net for this app, and CI never ran it.
      - name: Tests
        run: swift test

      - name: SwiftLint (code-quality scan)
        continue-on-error: true
        run: |
          brew install swiftlint
          swiftlint lint --quiet --reporter github-actions-logging || true
