<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F1F0"/>
      <stop offset="1" stop-color="#E4E4E2"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AAAEE"/>
      <stop offset="1" stop-color="#3B82CE"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82C4F8"/>
      <stop offset="1" stop-color="#4E9EE4"/>
    </linearGradient>
    <radialGradient id="apple" cx="452" cy="720" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F76F60"/>
      <stop offset="0.5" stop-color="#E04137"/>
      <stop offset="1" stop-color="#A61E1B"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83502A"/>
      <stop offset="1" stop-color="#563015"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="tabsh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="8" dy="5" stdDeviation="7" flood-color="#123863" flood-opacity="0.30"/>
    </filter>
    <mask id="bites">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <circle cx="676" cy="736" r="50" fill="black"/>
      <circle cx="676" cy="836" r="50" fill="black"/>
    </mask>
  </defs>

  <g clip-path="url(#tile)">
    <!-- baked off-white plate fills the ENTIRE tile (opaque) -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#plate)"/>

    <!-- blue folder fills sides + bottom, up to the white top -->
    <path d="M560 428 C560 376 588 316 642 316 H1024 V428 Z" fill="#3B82CE" filter="url(#tabsh)"/>
    <path d="M300 428 C300 376 328 316 382 316 H700 C756 316 784 376 784 428 Z"
          fill="#4C97DE" filter="url(#tabsh)"/>
    <path d="M0 316 H360 C440 316 460 428 540 428 H1024 V1024 H0 Z"
          fill="url(#back)" filter="url(#tabsh)"/>

    <!-- shadow the pocket casts on the back -->
    <rect x="0" y="472" width="1024" height="24" fill="#000000" opacity="0.10" filter="url(#blur)"/>

    <!-- front pocket to sides + bottom -->
    <path d="M0 496 Q512 482 1024 496 V1024 H0 Z" fill="url(#pocket)"/>
    <path d="M40 494 Q512 481 984 494" fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="4"/>

    <!-- apple -->
    <ellipse cx="512" cy="792" rx="176" ry="158" fill="#000000" opacity="0.12" filter="url(#blur)"/>
    <path d="M508 656 q2 -62 46 -88" fill="none" stroke="url(#stem)" stroke-width="21" stroke-linecap="round"/>
    <g mask="url(#bites)">
      <path d="M512 652 C550 616 622 618 656 672 C692 726 684 862 624 906
               C580 938 452 938 410 906 C350 862 342 726 378 672
               C412 618 484 616 512 652 Z" fill="url(#apple)"/>
    </g>
    <ellipse cx="450" cy="728" rx="42" ry="60" fill="#FFFFFF" opacity="0.22" transform="rotate(-20 450 728)"/>
  </g>
</svg>
