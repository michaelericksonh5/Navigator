<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54A6EC"/>
      <stop offset="1" stop-color="#3B82CE"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC0F7"/>
      <stop offset="1" stop-color="#4E9EE4"/>
    </linearGradient>
    <radialGradient id="apple" cx="452" cy="640" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F76F60"/>
      <stop offset="0.5" stop-color="#E04137"/>
      <stop offset="1" stop-color="#A61E1B"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66C95A"/>
      <stop offset="1" stop-color="#2C8A3B"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83502A"/>
      <stop offset="1" stop-color="#563015"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <mask id="bites">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <circle cx="650" cy="662" r="46" fill="black"/>
      <circle cx="650" cy="752" r="46" fill="black"/>
    </mask>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="512" cy="906" rx="356" ry="40" fill="#000000" opacity="0.18" filter="url(#blur)"/>

  <!-- folder back with a subtle integrated tab -->
  <path d="M96 384 C96 336 126 300 172 300 L300 300 C332 300 344 316 362 348
           C378 372 398 376 424 376 L832 376 C888 376 928 412 928 464
           L928 800 C928 852 888 892 832 892 L192 892 C136 892 96 852 96 800 Z"
        fill="url(#back)"/>

  <!-- front pocket -->
  <path d="M150 422 H874 A54 54 0 0 1 928 476 V838 A54 54 0 0 1 874 892 H150
           A54 54 0 0 1 96 838 V476 A54 54 0 0 1 150 422 Z" fill="url(#front)"/>
  <path d="M154 426 H870" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="4" stroke-linecap="round"/>

  <!-- apple shadow -->
  <ellipse cx="512" cy="720" rx="150" ry="140" fill="#000000" opacity="0.13" filter="url(#blur)"/>

  <!-- stem + leaf -->
  <path d="M508 606 q2 -56 42 -80" fill="none" stroke="url(#stem)" stroke-width="18" stroke-linecap="round"/>
  <path d="M554 532 q64 -38 108 4 q-58 42 -108 -4 z" fill="url(#leaf)"/>
  <path d="M568 532 q42 -2 84 4" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"/>

  <!-- apple body: clean single silhouette, heart-top, with two bites cut -->
  <g mask="url(#bites)">
    <path d="M512 604
             C544 574 604 576 632 622
             C662 670 656 784 604 822
             C566 850 458 850 420 822
             C368 784 362 670 392 622
             C420 576 480 574 512 604 Z" fill="url(#apple)"/>
  </g>

  <!-- gloss -->
  <ellipse cx="452" cy="660" rx="36" ry="54" fill="#FFFFFF" opacity="0.22" transform="rotate(-20 452 660)"/>
</svg>
