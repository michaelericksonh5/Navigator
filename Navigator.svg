<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54A6EC"/>
      <stop offset="1" stop-color="#3B82CE"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC0F7"/>
      <stop offset="1" stop-color="#4E9EE4"/>
    </linearGradient>
    <radialGradient id="apple" cx="452" cy="640" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F76F60"/>
      <stop offset="0.5" stop-color="#E04137"/>
      <stop offset="1" stop-color="#A61E1B"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83502A"/>
      <stop offset="1" stop-color="#563015"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <mask id="bites">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <circle cx="672" cy="672" r="48" fill="black"/>
      <circle cx="672" cy="768" r="48" fill="black"/>
    </mask>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="512" cy="936" rx="386" ry="38" fill="#000000" opacity="0.16" filter="url(#blur)"/>

  <!-- folder back with a subtle integrated tab (large, fills the canvas) -->
  <path d="M64 372 C64 336 90 300 146 300 L286 300 C322 300 334 316 352 344
           C368 366 388 372 414 372 L898 372 C930 372 960 402 960 448
           L960 858 C960 900 930 922 894 922 L130 922 C94 922 64 900 64 858 Z"
        fill="url(#back)"/>

  <!-- front pocket -->
  <path d="M124 390 H900 A60 60 0 0 1 960 450 V862 A60 60 0 0 1 900 922 H124
           A60 60 0 0 1 64 862 V450 A60 60 0 0 1 124 390 Z" fill="url(#front)"/>
  <path d="M128 394 H896" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="4" stroke-linecap="round"/>

  <!-- apple shadow -->
  <ellipse cx="512" cy="726" rx="168" ry="156" fill="#000000" opacity="0.13" filter="url(#blur)"/>

  <!-- stem (no leaf) -->
  <path d="M508 596 q2 -60 46 -86" fill="none" stroke="url(#stem)" stroke-width="20" stroke-linecap="round"/>

  <!-- apple body: clean iconic silhouette, two bites cut -->
  <g mask="url(#bites)">
    <path d="M512 590
             C548 556 616 558 648 610
             C682 662 674 792 616 834
             C574 866 450 866 408 834
             C350 792 342 662 376 610
             C408 558 476 556 512 590 Z" fill="url(#apple)"/>
  </g>

  <!-- gloss -->
  <ellipse cx="450" cy="662" rx="40" ry="58" fill="#FFFFFF" opacity="0.22" transform="rotate(-20 450 662)"/>
</svg>
