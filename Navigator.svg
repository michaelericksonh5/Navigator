<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AAAEE"/>
      <stop offset="1" stop-color="#3E86C8"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84C5F8"/>
      <stop offset="1" stop-color="#4E9EE4"/>
    </linearGradient>
    <radialGradient id="apple" cx="452" cy="700" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F76F60"/>
      <stop offset="0.5" stop-color="#E04137"/>
      <stop offset="1" stop-color="#A61E1B"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83502A"/>
      <stop offset="1" stop-color="#563015"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="tabsh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="8" dy="6" stdDeviation="8" flood-color="#123863" flood-opacity="0.28"/>
    </filter>
    <mask id="bites">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <circle cx="676" cy="716" r="50" fill="black"/>
      <circle cx="676" cy="816" r="50" fill="black"/>
    </mask>
  </defs>

  <g clip-path="url(#tile)">
    <!-- base blue fills the entire tile (edges, corners, bottom) -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#back)"/>

    <!-- back tab (darkest, flush RIGHT) -->
    <path d="M600 300 C600 240 626 110 682 110 H980 A44 44 0 0 1 1024 154 V300 Z"
          fill="#3B82CE" filter="url(#tabsh)"/>
    <!-- middle tab (same shape, stepped uniformly) -->
    <path d="M404 300 C404 240 430 110 486 110 H716 C772 110 798 240 798 300 Z"
          fill="#4C97DE" filter="url(#tabsh)"/>
    <!-- left tab (same blue as folder, flush LEFT) -->
    <path d="M0 300 V154 A44 44 0 0 1 44 110 H360 C436 110 462 300 548 300 Z"
          fill="url(#back)" filter="url(#tabsh)"/>

    <!-- shadow the pocket casts on the back -->
    <rect x="0" y="418" width="1024" height="26" fill="#000000" opacity="0.10" filter="url(#blur)"/>

    <!-- front pocket fills to the bottom + sides -->
    <rect x="0" y="440" width="1024" height="584" fill="url(#pocket)"/>
    <path d="M40 444 H984" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="4" stroke-linecap="round"/>

    <!-- apple -->
    <ellipse cx="512" cy="772" rx="180" ry="160" fill="#000000" opacity="0.12" filter="url(#blur)"/>
    <path d="M508 636 q2 -62 46 -88" fill="none" stroke="url(#stem)" stroke-width="21" stroke-linecap="round"/>
    <g mask="url(#bites)">
      <path d="M512 632 C550 596 622 598 656 652 C692 706 684 842 624 886
               C580 918 452 918 410 886 C350 842 342 706 378 652
               C412 598 484 596 512 632 Z" fill="url(#apple)"/>
    </g>
    <ellipse cx="450" cy="708" rx="42" ry="60" fill="#FFFFFF" opacity="0.22" transform="rotate(-20 450 708)"/>
  </g>
</svg>
