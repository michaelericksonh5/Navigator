<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5BD45"/>
      <stop offset="1" stop-color="#E0A62E"/>
    </linearGradient>
    <linearGradient id="apple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EA4A40"/>
      <stop offset="1" stop-color="#C22C26"/>
    </linearGradient>
  </defs>

  <!-- Folder -->
  <rect x="143" y="250" width="328" height="170" rx="36" fill="#D69626"/>
  <rect x="102" y="330" width="820" height="440" rx="56" fill="url(#folder)"/>
  <rect x="102" y="430" width="820" height="360" rx="56" fill="#F8CE68"/>

  <!-- Apple -->
  <rect x="499" y="452" width="26" height="78" rx="12" fill="#6B4423"/>
  <g transform="rotate(32 560 470)">
    <ellipse cx="560" cy="470" rx="58" ry="28" fill="#4CAF54"/>
  </g>
  <circle cx="512" cy="628" r="128" fill="url(#apple)"/>
  <!-- Two bites (folder-flap colored) -->
  <circle cx="640" cy="628" r="68" fill="#F8CE68"/>
  <circle cx="384" cy="628" r="68" fill="#F8CE68"/>
</svg>
