<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBB047"/>
      <stop offset="1" stop-color="#D2942A"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4C556"/>
      <stop offset="1" stop-color="#E0A836"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDDC81"/>
      <stop offset="1" stop-color="#F0BB4C"/>
    </linearGradient>
    <radialGradient id="apple" cx="0.36" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#F46A5E"/>
      <stop offset="0.5" stop-color="#DE3E35"/>
      <stop offset="1" stop-color="#A81E1B"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63C457"/>
      <stop offset="1" stop-color="#2C8A3B"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#814E27"/>
      <stop offset="1" stop-color="#573015"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <mask id="bites">
      <rect x="0" y="0" width="1024" height="1024" fill="black"/>
      <circle cx="512" cy="632" r="148" fill="white"/>
      <circle cx="650" cy="585" r="58" fill="black"/>
      <circle cx="650" cy="688" r="58" fill="black"/>
    </mask>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="512" cy="838" rx="360" ry="46" fill="#000000" opacity="0.20" filter="url(#blur)"/>

  <!-- folder -->
  <rect x="150" y="344" width="300" height="132" rx="34" fill="url(#tab)"/>
  <rect x="112" y="396" width="800" height="426" rx="52" fill="url(#back)"/>
  <path d="M112 474 h800 v296 a52 52 0 0 1 -52 52 h-696 a52 52 0 0 1 -52 -52 z" fill="url(#front)"/>
  <rect x="112" y="474" width="800" height="5" rx="2.5" fill="#FFFFFF" opacity="0.45"/>

  <!-- apple soft shadow -->
  <ellipse cx="512" cy="656" rx="150" ry="150" fill="#000000" opacity="0.15" filter="url(#blur)"/>

  <!-- stem + leaf -->
  <path d="M506 512 q4 -52 44 -70" fill="none" stroke="url(#stem)" stroke-width="19" stroke-linecap="round"/>
  <path d="M552 452 q64 -40 108 2 q-58 44 -108 -2 z" fill="url(#leaf)"/>
  <path d="M566 452 q40 -2 82 4" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4"/>

  <!-- apple body with two bites cut out -->
  <g mask="url(#bites)">
    <circle cx="512" cy="632" r="148" fill="url(#apple)"/>
  </g>

  <!-- specular gloss -->
  <ellipse cx="466" cy="582" rx="40" ry="58" fill="#FFFFFF" opacity="0.22" transform="rotate(-20 466 582)"/>
</svg>
