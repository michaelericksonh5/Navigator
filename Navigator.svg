<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="sq">
      <path d="M285 100 H739 A185 185 0 0 1 924 285 V739 A185 185 0 0 1 739 924
               H285 A185 185 0 0 1 100 739 V285 A185 185 0 0 1 285 100 Z"/>
    </clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E9EE4"/>
      <stop offset="1" stop-color="#3E86C8"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82C3F8"/>
      <stop offset="1" stop-color="#4E9EE4"/>
    </linearGradient>
    <radialGradient id="apple" cx="452" cy="650" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F76F60"/>
      <stop offset="0.5" stop-color="#E04137"/>
      <stop offset="1" stop-color="#A61E1B"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83502A"/>
      <stop offset="1" stop-color="#563015"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <mask id="bites">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <circle cx="672" cy="668" r="48" fill="black"/>
      <circle cx="672" cy="762" r="48" fill="black"/>
    </mask>
  </defs>

  <g clip-path="url(#sq)">
    <!-- base body fills the whole squircle to the top -->
    <rect x="100" y="100" width="824" height="824" fill="url(#base)"/>

    <!-- three folder tabs across the top, lighter -> darker left to right -->
    <path d="M150 214 A56 56 0 0 1 206 158 H352 A56 56 0 0 1 408 214 V470 H150 Z" fill="#8AC6F8"/>
    <path d="M400 198 A56 56 0 0 1 456 142 H602 A56 56 0 0 1 658 198 V470 H400 Z" fill="#5AA6EC"/>
    <path d="M650 214 A56 56 0 0 1 706 158 H852 A56 56 0 0 1 908 214 V470 H650 Z" fill="#3B7FC4"/>

    <!-- soft shadow cast by the front pocket over the tabs -->
    <rect x="100" y="430" width="824" height="26" fill="#000000" opacity="0.12" filter="url(#blur)"/>

    <!-- front pocket fills to the bottom corners -->
    <rect x="100" y="452" width="824" height="472" fill="url(#pocket)"/>
    <rect x="118" y="456" width="788" height="5" rx="2.5" fill="#FFFFFF" opacity="0.45"/>

    <!-- apple -->
    <ellipse cx="512" cy="726" rx="166" ry="150" fill="#000000" opacity="0.12" filter="url(#blur)"/>
    <path d="M508 596 q2 -60 46 -86" fill="none" stroke="url(#stem)" stroke-width="20" stroke-linecap="round"/>
    <g mask="url(#bites)">
      <path d="M512 592 C548 558 616 560 648 612 C682 664 674 794 616 836
               C574 868 450 868 408 836 C350 794 342 664 376 612
               C408 560 476 558 512 592 Z" fill="url(#apple)"/>
    </g>
    <ellipse cx="452" cy="664" rx="40" ry="58" fill="#FFFFFF" opacity="0.22" transform="rotate(-20 452 664)"/>
  </g>
</svg>
